name: Build Rejoin APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintRelease
      - name: Sign optimized APK for testing
        shell: bash
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          keydir="$(mktemp -d "$RUNNER_TEMP/rejoin-test.XXXXXXXX")"
          trap 'rm -rf -- "$keydir"' EXIT
          keytool -genkeypair -storetype PKCS12 -keystore "$keydir/test.p12" \
            -storepass android -alias rejoin-test -dname "CN=Rejoin Test" -keyalg RSA -validity 365
          "$tools/apksigner" sign --ks "$keydir/test.p12" \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias rejoin-test \
            --out "$RUNNER_TEMP/Rejoin-test.apk" app/build/outputs/apk/release/app-release-unsigned.apk
          "$tools/apksigner" verify "$RUNNER_TEMP/Rejoin-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Rejoin-optimized-test-apk
          path: ${{ runner.temp }}/Rejoin-test.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Rejoin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
